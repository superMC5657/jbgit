[package]
name = "jgit-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "jgit"
path = "src/main.rs"

[dependencies]
jgit-core.workspace = true
jgit-engine.workspace = true

anyhow.workspace = true
chrono.workspace = true
crossterm.workspace = true
futures.workspace = true
ratatui.workspace = true
rustc-hash.workspace = true
syntect.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-width.workspace = true
tiny-skia = { workspace = true, optional = true }
png = { workspace = true, optional = true }

[features]
default = ["graphics-protocol"]
# Optional pixel-level anti-aliased vector graph backend (tiny-skia + Kitty / Sixel / iTerm2 image protocols).
graphics-protocol = ["dep:tiny-skia", "dep:png"]

[dev-dependencies]
insta.workspace = true
