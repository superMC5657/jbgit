# jbgit 主配置文件 (jbgit.toml)
# 对标 Yazi 体系的通用配置

[general]
# 界面语言: "zh-CN" (简体中文), "en-US" (English), "auto" (跟随系统环境变量)
language = "zh-CN"

# 启动时默认打开的工作区标签页: "log" (提交历史), "commit" (提交工作台), "branches" (分支一览), "stash" (贮藏箱), "console" (控制台)
default_tab = "log"

# 主题预设风格: "darcula" (JetBrains经典深色), "catppuccin-mocha", "gruvbox-dark"
# 具体颜色细项可在 theme.toml 中精细调整
flavor = "darcula"

[graph]
# 提交图渲染引擎: "auto" (自动侦测图形协议), "vector" (Kitty/Sixel/iTerm2 矢量图), "cell" (ASCII/Unicode 字符网格)
backend = "auto"

# 图标与图形字符模式: "nerd_font" (需要终端安装 Nerd Font 字体), "unicode" (通用 Unicode 单宽符号)
glyph_mode = "nerd_font"

# 是否默认折叠长分支标签胶囊 (紧凑模式)
compact_refs = false

[diff]
# 代码差异高亮: 是否开启语法加亮 (基于 syntect)
syntax_highlight = true

# 制表符 (Tab) 宽度
tab_size = 4

# Diff 上下文保留行数
context_lines = 3

[layout]
# --- Log 提交历史视图 ---
# 横向三栏比例: [左侧分支树, 中间提交图谱, 右侧变更与详情区]
# 对标 Yazi manager.ratio 规范 (默认 [1, 3, 2])
log_ratio = [ 1, 3, 2 ]

# 右侧栏上下比例: [上方变更文件树, 下方提交详情/内联 Diff] (默认 [3, 2])
log_details_ratio = [ 3, 2 ]

# 右侧停靠 Diff 预览横向比例: [左侧主区(提交图谱+变更详情), 右侧停靠 Diff] (默认 [2, 1])
log_diff_right_ratio = [ 2, 1 ]

# 底部停靠 Diff 预览上下比例: [上方日志主区, 下方停靠 Diff] (默认 [3, 2])
log_diff_bottom_ratio = [ 3, 2 ]

# --- Commit 提交工作台 ---
# 横向两栏比例: [左侧本地变更与提交区, 右侧 Diff 预览] (默认 [1, 2])
commit_ratio = [ 1, 2 ]

# 左侧栏上下比例: [上方本地变更文件树, 下方提交说明] (默认 [3, 2])
commit_left_ratio = [ 3, 2 ]

# --- Stash 贮藏箱 ---
# 横向两栏比例: [左侧贮藏条目, 右侧变更与 Diff 预览] (默认 [2, 3])
stash_ratio = [ 2, 3 ]

# 右侧预览区上下比例: [上方变更文件树, 下方 Diff 预览] (默认 [1, 2])
stash_preview_ratio = [ 1, 2 ]

# --- Console 控制台 ---
# 横向两栏比例: [左侧命令历史, 右侧执行输出] (默认 [2, 3])
console_ratio = [ 2, 3 ]
