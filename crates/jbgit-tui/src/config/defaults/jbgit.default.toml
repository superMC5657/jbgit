# jbgit 主配置文件 (jbgit.toml)
# 对标 Yazi 体系的通用配置

[general]
# 界面语言: "zh-CN" (简体中文), "en-US" (English), "auto" (跟随系统环境变量)
language = "zh-CN"

# 启动时默认打开的工作区标签页: "log" (提交历史), "commit" (提交工作台), "branches" (分支一览), "stash" (贮藏箱), "console" (控制台)
default_tab = "log"

# 主题预设风格: "darcula" (JetBrains经典深色), "catppuccin-mocha", "gruvbox-dark"
# 完整调色板位于同目录 themes/<flavor>.toml，可直接编辑覆盖，也可新建 themes/<自定义名称>.toml
flavor = "darcula"

[keymap]
# 快捷键预设风格: "default" (极简零冲突), "jetbrains" (IDEA 习惯), "vim" (Vim / Lazygit 风格)
# 完整与增量键位表位于同目录 keymaps/<preset>.toml，可直接编辑覆盖，也可新建 keymaps/<自定义名称>.toml
preset = "default"

# 底部快捷键提示栏最大行数（1 = 单行并折叠溢出为 +N；>1 = 自动多行；0 = 隐藏常驻提示）
footer_max_lines = 1

# 分支树面板是否直接打字触发模糊速查（默认跟随所选预设：default/vim 为 false，jetbrains 为 true；取消注释可强制覆盖）
# tree_speed_search = false

[graph]
# 提交图渲染引擎: "auto" (自动侦测图形协议), "vector" (Kitty/Sixel/iTerm2 矢量图), "cell" (ASCII/Unicode 字符网格)
backend = "auto"

# 图标与图形字符模式: "nerd_font" (需要终端安装 Nerd Font 字体), "unicode" (通用 Unicode 单宽符号)
glyph_mode = "nerd_font"

# 是否默认折叠长分支标签胶囊 (紧凑模式)
compact_refs = false

[log]
# 启用路径筛选 (Paths) 时，右侧变更文件树是否仅显示命中筛选路径的文件
show_only_affected_changes = true

[diff]
# 代码差异高亮: 是否开启语法加亮 (基于 syntect)
syntax_highlight = true

# 制表符 (Tab) 宽度
tab_size = 4

# Diff 上下文保留行数
context_lines = 3

# 空白忽略模式: "default" (精确比对), "ignore-change" (-b 忽略空白数量变化), "ignore-all" (-w 忽略所有空白)
whitespace = "default"

# Diff 超长行是否默认软换行 (false = 支持左右水平滚动)
soft_wrap = false

[annotate]
# 逐行注解 (Git Blame) 默认行为
ignore_whitespace = false
detect_moves = false
gutter_width = 28

[push]
# 受保护分支（支持通配符 glob）；对其启用强推时将在 Push 对话框中禁用并提示原因
protected_branches = ["main", "master"]

[worktree]
# 新建 Worktree 的默认父目录（路径为 <目录>/<仓库名>-<分支名>）；留空 = 主工作区的父目录，支持 ~/
default_parent = ""

[update]
# Update Project（<A-u>）同步当前分支的方式："git-config"（遵循 branch.<name>.rebase / pull.rebase）| "merge" | "rebase"
mode = "git-config"
# 更新前自动贮藏本地改动，结束后恢复
save_changes = true
# 同时快进其他设置了 upstream 的本地分支（不能快进的会在摘要中列为"已跳过"）
update_other_branches = true

[layout]
# --- Log 提交历史视图 ---
# 横向三栏比例: [左侧分支树, 中间提交图谱, 右侧变更与详情区]
# 对标 Yazi manager.ratio 规范 (默认 [1, 3, 2])
log_ratio = [ 1, 3, 2 ]

# 右侧栏上下比例: [上方变更文件树, 下方提交详情/内联 Diff] (默认 [3, 2])
log_details_ratio = [ 3, 2 ]

# 右侧停靠 Diff 预览横向比例: [左侧主区(提交图谱+变更详情), 右侧停靠 Diff] (默认 [2, 1])
log_diff_right_ratio = [ 2, 1 ]

# 底部停靠 Diff 预览上下比例: [上方日志主区, 下方停靠 Diff] (默认 [3, 2])
log_diff_bottom_ratio = [ 3, 2 ]

# --- Commit 提交工作台 ---
# 横向两栏比例: [左侧本地变更与提交区, 右侧 Diff 预览] (默认 [1, 2])
commit_ratio = [ 1, 2 ]

# 左侧栏上下比例: [上方本地变更文件树, 下方提交说明] (默认 [3, 2])
commit_left_ratio = [ 3, 2 ]

# --- Stash 贮藏箱 ---
# 横向两栏比例: [左侧贮藏条目, 右侧变更与 Diff 预览] (默认 [2, 3])
stash_ratio = [ 2, 3 ]

# 右侧预览区上下比例: [上方变更文件树, 下方 Diff 预览] (默认 [1, 2])
stash_preview_ratio = [ 1, 2 ]

# --- Console 控制台 ---
# 横向两栏比例: [左侧命令历史, 右侧执行输出] (默认 [2, 3])
console_ratio = [ 2, 3 ]

# --- File History 文件历史窗口 ---
# 宽屏横向两栏比例: [左侧提交列表, 右侧 Diff 预览] (默认 [2, 3])
file_history_ratio = [ 2, 3 ]

# 窄屏上下两栏比例: [上方提交列表, 下方 Diff 预览] (默认 [2, 3])
file_history_vertical_ratio = [ 2, 3 ]

[performance]
# 超过该索引条目阈值时按大仓库自适应降级 status 扫描开销
large_index_entries = 20000

# 工作区未暂存重命名检测策略: "auto" (大仓库自动关闭), "always", "never"
worktree_renames = "auto"

# 未跟踪目录递归展开策略: "always", "auto" (大仓库仅展示目录项), "never"
recurse_untracked_dirs = "always"

# 快照加载时是否预读提交正文 (关闭可降低超大仓库冷启动内存, 但文本搜索仅匹配标题/作者/哈希)
load_commit_bodies = true
