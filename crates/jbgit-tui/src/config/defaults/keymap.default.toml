# jbgit 快捷键映射配置文件 (keymap.toml)
# 统一成熟方案（Lazygit + Yazi + Vim 语义融合，全视图零冲突）：
#   - 通用导航收敛于 [global]（j/k/h/l、方向键、Ctrl+D/U 半页、PgUp/PgDn、gg/G、Home/End）
#   - 动词语义全局一致：d/Del 删弃回滚、r/F2 重命名/改说明、n 新建、e 外编、H 文件历史、v 行选、m 合并父提交
#   - 双语义前缀（配合 Which-Key 自动提示）：g 族 = 跳转导航，z 族 = 视图/布局/折叠
#   - 增量覆写 (推荐): 在对应区块使用 prepend_keymap，只覆盖特定按键而保留同动作的其他别名
#   - 解绑按键: 设置 run = "noop" 即可禁用某条默认快捷键
#   - 底栏与页内提示控制:
#       * show_hint = true / false 控制该绑定是否展示在底部快捷键提示栏（省略则继承同动作默认设置）
#       * footer_max_lines 控制底栏最大行数（1 = 单行并折叠溢出为 +N；>1 = 自动多行；0 = 隐藏常驻提示）
#       * footer_compact_pairs 控制是否自动合并成对底栏胶囊（如 [/] 块、s/u 暂/取、a/A 应用/弹出、p/P 拉/推）
#       * show_inline_key_badges 控制是否在页面按钮与工具栏自适应内嵌动态快捷键键帽

# 快捷键预设风格:
#   - "default"   : 统一现代零冲突预设（推荐，原生包含 Vim 导航与 g/z 前缀族）
#   - "jetbrains" : 贴近 IntelliJ IDEA 习惯（开启分支树直接打字速查，置顶 Ctrl+K / Ctrl+T / Ctrl+Shift+K / Ctrl+D / F2 / F4）
#   - "vim"       : default 兼容别名（并在 Diff 底栏显式优先提示 s / u 暂存与取消暂存）
preset = "default"

# 分支树面板是否直接打字触发模糊速查（false = 按 / 或 Ctrl+F 进入搜索，不吞掉单键快捷键）
tree_speed_search = false

# 底部快捷键提示栏最大行数（默认 1 行溢出显示 +N；设为 2~3 允许自动折行；设为 0 隐藏常驻提示）
footer_max_lines = 1

# 自动合并成对底栏胶囊（例如 [/] 代码块、{/} 文件、s/u 暂/取、a/A 应用/弹出、p/P 拉/推）
footer_compact_pairs = true

# 在页面按钮与工具栏自适应内嵌动态快捷键键帽（例如 ▶ 应用 [a]、提交 [Ctrl+S]）
show_inline_key_badges = true

[global]
key_bindings = [
    # ── 系统与工作区 ──
    { on = [ "q" ], run = "quit", desc = "退出 jbgit" },
    { on = [ "." ], run = "context_menu", desc = "打开当前选中项的操作菜单", show_hint = true },
    { on = [ "<S-F10>" ], run = "context_menu", desc = "打开当前选中项的操作菜单" },
    { on = [ "b" ], run = "toggle_branches_popup", desc = "呼出全局分支速查浮窗", show_hint = true },
    { on = [ "g", "b" ], run = "toggle_branches_popup", desc = "呼出全局分支速查浮窗" },
    { on = [ "<C-`>" ], run = "toggle_branches_popup", desc = "呼出全局分支速查浮窗" },
    { on = [ "<C-~>" ], run = "toggle_branches_popup", desc = "呼出全局分支速查浮窗" },
    { on = [ "p" ], run = "git_pull", desc = "拉取当前分支更新 (Pull)", show_hint = true },
    { on = [ "P" ], run = "git_push", desc = "推送当前分支 (Push…)", show_hint = true },
    { on = [ "f" ], run = "git_fetch", desc = "获取远程更新 (Fetch)" },
    { on = [ "R" ], run = "refresh", desc = "刷新 Git 仓库状态", show_hint = true },
    { on = [ "<F5>" ], run = "refresh", desc = "刷新 Git 仓库状态" },
    { on = [ "?" ], run = "help", desc = "打开可搜索快捷键帮助 / 命令面板", show_hint = true },
    { on = [ "1" ], run = "tab_commit", desc = "切换至 [1] 提交工作台" },
    { on = [ "<A-1>" ], run = "tab_commit", desc = "切换至 [1] 提交工作台" },
    { on = [ "2" ], run = "tab_log", desc = "切换至 [2] 历史日志" },
    { on = [ "<A-2>" ], run = "tab_log", desc = "切换至 [2] 历史日志" },
    { on = [ "3" ], run = "tab_stash", desc = "切换至 [3] 贮藏箱" },
    { on = [ "<A-3>" ], run = "tab_stash", desc = "切换至 [3] 贮藏箱" },
    { on = [ "4" ], run = "tab_console", desc = "切换至 [4] 控制台" },
    { on = [ "<A-4>" ], run = "tab_console", desc = "切换至 [4] 控制台" },
    { on = [ "<Tab>" ], run = "focus_next", desc = "切换到下一个面板" },
    { on = [ "<BackTab>" ], run = "focus_prev", desc = "切换到上一个面板" },

    # ── 统一导航（所有列表 / 树 / 预览 / 控制台共享） ──
    { on = [ "j" ], run = "cursor_down", desc = "向下移动 / 滚动一行" },
    { on = [ "<Down>" ], run = "cursor_down", desc = "向下移动 / 滚动一行" },
    { on = [ "k" ], run = "cursor_up", desc = "向上移动 / 滚动一行" },
    { on = [ "<Up>" ], run = "cursor_up", desc = "向上移动 / 滚动一行" },
    { on = [ "h" ], run = "tree_collapse", desc = "折叠节点 / 返回上层 / 跳至子提交" },
    { on = [ "<Left>" ], run = "tree_collapse", desc = "折叠节点 / 返回上层 / 跳至子提交" },
    { on = [ "l" ], run = "tree_expand", desc = "展开节点 / 进入详情 / 跳至父提交" },
    { on = [ "<Right>" ], run = "tree_expand", desc = "展开节点 / 进入详情 / 跳至父提交" },
    { on = [ "<C-d>" ], run = "page_down_half", desc = "向下半页" },
    { on = [ "<C-u>" ], run = "page_up_half", desc = "向上半页" },
    { on = [ "<PageDown>" ], run = "page_down", desc = "向下整页" },
    { on = [ "<PageUp>" ], run = "page_up", desc = "向上整页" },
    { on = [ "g", "g" ], run = "goto_top", desc = "跳转至顶部" },
    { on = [ "<Home>" ], run = "goto_top", desc = "跳转至顶部" },
    { on = [ "G" ], run = "goto_bottom", desc = "跳转至底部" },
    { on = [ "<End>" ], run = "goto_bottom", desc = "跳转至底部" },

    # ── 全局视图与外观 (z 族) ──
    { on = [ "z", "g" ], run = "cycle_graph_renderer", desc = "循环切换提交图渲染后端" },
    { on = [ "<F8>" ], run = "cycle_graph_renderer", desc = "循环切换提交图渲染后端" },
    { on = [ "z", "i" ], run = "toggle_glyph_mode", desc = "切换图标模式 (Nerd Font / Unicode)" },
    { on = [ "<F12>" ], run = "toggle_glyph_mode", desc = "切换图标模式 (Nerd Font / Unicode)" },
    { on = [ "z", "p" ], run = "palette", desc = "打开主题调色板预览" },
]

