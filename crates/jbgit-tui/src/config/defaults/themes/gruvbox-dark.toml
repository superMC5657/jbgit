bg_hover = "#3C3836"
border_splitter = "#504945"
border_focused = "#83A598"
fg_primary = "#EBDBB2"
fg_bright = "#FBF1C7"
fg_muted = "#928374"
fg_accent_link = "#83A598"
status_modified = "#83A598"
status_added = "#B8BB26"
status_untracked = "#928374"
