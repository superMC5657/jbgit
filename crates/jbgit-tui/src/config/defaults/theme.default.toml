# jbgit 主题配色配置文件 (theme.toml)
# 对标 Yazi 体系的颜色、样式与图标配置

# 主题预设: "darcula" (JetBrains原生), "catppuccin-mocha", "gruvbox-dark"
# 选择预设后，下方 [palette] 中取消注释并指定的颜色会进一步叠加覆盖
flavor = "darcula"

[glyphs]
# 图标模式: "nerd_font" (推荐) 或 "unicode"
mode = "nerd_font"

[palette]
# 取消下方对应项的注释即可单独覆写语义颜色 (十六进制 RGB: #RRGGBB)
