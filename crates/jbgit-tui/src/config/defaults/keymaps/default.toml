# jbgit 快捷键预设：default（四层金字塔零冲突默认底表）
# 1. 宇宙通用键：q / ? / . / / / 1-4 / Tab / Enter / Esc / j,k / g g,G
# 2. 大写字母 = 全局仓库级动作（B/F/L/P/U/R/O/W/C）
# 3. 小写字母 = 当前面板局部动作（跨面板同义同键，零全局冲突）
# 4. g / z 前缀 = Which-Key 低频高级操作与视图折叠开关
# 所有其他预设（jetbrains / vim / 自定义预设）均以此文件作为基础底表。
# 放置在配置目录的 keymaps/default.toml 中可覆写或替换内置默认映射。

# 分支树面板是否直接打字触发模糊速查（false = 按 / 或 Ctrl+F 进入搜索）
tree_speed_search = false

# 底部快捷键提示栏最大行数
footer_max_lines = 1

[global]
key_bindings = [
    { on = [ "q" ], run = "quit", desc = "退出 jbgit" },
    { on = [ "." ], run = "context_menu", desc = "打开当前选中项的操作菜单", show_hint = true },
    { on = [ "<S-F10>" ], run = "context_menu", desc = "打开当前选中项的操作菜单" },
    { on = [ "<Menu>" ], run = "context_menu", desc = "打开当前选中项的操作菜单" },
    { on = [ "?" ], run = "help", desc = "打开可搜索快捷键帮助 / 命令面板", show_hint = true },

    # ── 全局工作区切换 ──
    { on = [ "1" ], run = "tab_commit", desc = "切换至 [1] 提交工作台" },
    { on = [ "<A-1>" ], run = "tab_commit", desc = "切换至 [1] 提交工作台" },
    { on = [ "2" ], run = "tab_log", desc = "切换至 [2] 历史日志" },
    { on = [ "<A-2>" ], run = "tab_log", desc = "切换至 [2] 历史日志" },
    { on = [ "3" ], run = "tab_stash", desc = "切换至 [3] 贮藏箱" },
    { on = [ "<A-3>" ], run = "tab_stash", desc = "切换至 [3] 贮藏箱" },
    { on = [ "4" ], run = "tab_console", desc = "切换至 [4] 控制台" },
    { on = [ "<A-4>" ], run = "tab_console", desc = "切换至 [4] 控制台" },
    { on = [ "<Tab>" ], run = "focus_next", desc = "切换到下一个面板" },
    { on = [ "<BackTab>" ], run = "focus_prev", desc = "切换到上一个面板" },

    # ── 大写全局：跨面板一致的仓库级动作（B / F / L / P / U / R / O / W / C） ──
    { on = [ "B" ], run = "toggle_branches_popup", desc = "呼出全局分支速查浮窗", show_hint = true },
    { on = [ "<C-`>" ], run = "toggle_branches_popup", desc = "呼出全局分支速查浮窗" },
    { on = [ "<C-~>" ], run = "toggle_branches_popup", desc = "呼出全局分支速查浮窗" },
    { on = [ "<A-b>" ], run = "toggle_branches_popup", desc = "呼出全局分支速查浮窗" },
    { on = [ "g", "b" ], run = "toggle_branches_popup", desc = "呼出全局分支速查浮窗" },
    { on = [ "F" ], run = "git_fetch", desc = "获取远程更新 (Fetch)" },
    { on = [ "L" ], run = "git_pull", desc = "拉取当前分支更新 (Pull)", show_hint = true },
    { on = [ "P" ], run = "git_push", desc = "推送当前分支 (Push…)", show_hint = true },
    { on = [ "U" ], run = "update_project", desc = "更新项目 (Update Project)" },
    { on = [ "<A-u>" ], run = "update_project", desc = "更新项目 (Update Project)" },
    { on = [ "R" ], run = "refresh", desc = "刷新 Git 仓库状态" },
    { on = [ "<F5>" ], run = "refresh", desc = "刷新 Git 仓库状态" },
    { on = [ "O" ], run = "switch_repository", desc = "切换仓库 (最近仓库 / Worktree / 子模块)" },
    { on = [ "<A-o>" ], run = "switch_repository", desc = "切换仓库 (最近仓库 / Worktree / 子模块)" },
    { on = [ "W" ], run = "worktrees", desc = "管理 Worktree (Working Trees…)" },
    { on = [ "<A-w>" ], run = "worktrees", desc = "管理 Worktree (Working Trees…)" },
    { on = [ "C" ], run = "resolve_conflicts", desc = "解决合并冲突 (Resolve Conflicts…)" },
    { on = [ "<A-c>" ], run = "resolve_conflicts", desc = "解决合并冲突 (Resolve Conflicts…)" },

    # ── g 前缀高级对话框（Which-Key 自动提示，同时保留 Alt 兼容别名） ──
    { on = [ "g", "p" ], run = "git_pull_dialog", desc = "拉取选项对话框 (Pull…)" },
    { on = [ "<A-l>" ], run = "git_pull_dialog", desc = "拉取选项对话框 (Pull…)" },
    { on = [ "g", "e" ], run = "git_rebase_dialog", desc = "变基选项对话框 (Rebase…)" },
    { on = [ "<A-e>" ], run = "git_rebase_dialog", desc = "变基选项对话框 (Rebase…)" },
    { on = [ "g", "m" ], run = "configure_remotes", desc = "管理远端 (Configure Remotes…)" },
    { on = [ "<A-r>" ], run = "configure_remotes", desc = "管理远端 (Configure Remotes…)" },

    # ── 修饰键 / 功能键 ──
    { on = [ "<C-A-n>" ], run = "new_branch", desc = "在当前位置 / HEAD 新建分支" },
    { on = [ "<A-S-g>" ], run = "bisect_good", desc = "标记当前提交为 Good (Bisect)" },
    { on = [ "<A-S-b>" ], run = "bisect_bad", desc = "标记当前提交为 Bad (Bisect)" },
    { on = [ "<A-S-s>" ], run = "bisect_skip", desc = "跳过当前提交 (Bisect Skip)" },
    { on = [ "<A-S-r>" ], run = "bisect_reset", desc = "结束并重置二分查找 (Bisect Reset)" },
    { on = [ "<F12>" ], run = "toggle_glyph_mode", desc = "切换 Unicode / NerdFont 图标模式" },
    { on = [ "<F8>" ], run = "cycle_graph_renderer", desc = "切换提交图谱渲染器" },
]

