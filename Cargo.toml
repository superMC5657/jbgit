[workspace]
resolver = "3"
members = [
    "crates/jbgit-core",
    "crates/jbgit-engine",
    "crates/jbgit-tui",
    "tools/jbgit-pilot",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
jbgit-core = { path = "crates/jbgit-core" }
jbgit-engine = { path = "crates/jbgit-engine" }

anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossbeam-channel = "0.5"
crossterm = { version = "0.29", features = ["event-stream"] }
fixedbitset = "0.5"
futures = "0.3"
getrandom = "0.3"
git2 = { version = "0.21", default-features = false }
imara-diff = "0.2"
insta = "1"
notify = "8"
notify-debouncer-mini = "0.7"
nucleo-matcher = "0.3"
proptest = "1"
regex = "1"
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tempfile = "3"
thiserror = "2"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
png = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "signal", "net"] }
toml = "0.8"
unicode-width = "0.2"
windows-sys = "0.61"
zeroize = "1"
criterion = { version = "0.8", default-features = false }

[profile.dev.package.syntect]
opt-level = 3

[profile.dev.package.fancy-regex]
opt-level = 3

[profile.dev.package.imara-diff]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.tiny-skia]
opt-level = 3
