[workspace]
resolver = "3"
members = [
    "crates/jgit-core",
    "crates/jgit-engine",
    "crates/jgit-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
jgit-core = { path = "crates/jgit-core" }
jgit-engine = { path = "crates/jgit-engine" }

anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossbeam-channel = "0.5"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
git2 = { version = "0.21", default-features = false }
notify = "8"
notify-debouncer-mini = "0.7"
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
rustc-hash = "2.1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "signal"] }
tracing = "0.1"
unicode-width = "0.2"
