name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: jbgit.exe
            archive_name: jbgit-${{ github.ref_name }}-windows-x86_64
            archive_ext: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: jbgit
            archive_name: jbgit-${{ github.ref_name }}-linux-x86_64
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: jbgit
            archive_name: jbgit-${{ github.ref_name }}-macos-arm64
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked -p jbgit-tui --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist/stage
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" dist/stage/
          cp README.md dist/stage/
          tar -C dist/stage -czf "dist/${{ matrix.archive_name }}.tar.gz" .

      - name: Package archive (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" dist/stage/
          Copy-Item README.md dist/stage/
          Compress-Archive -Path dist/stage/* -DestinationPath "dist/${{ matrix.archive_name }}.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ matrix.archive_name }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
